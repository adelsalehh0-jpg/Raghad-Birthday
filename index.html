<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Raghad</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top left, #fff1f6, transparent 35%),
        radial-gradient(circle at bottom right, #ffeef5, transparent 35%),
        #ffffff;

    display: flex;
    justify-content: center;
    align-items: center;

    color: #87445f;
}


/* الخلفية */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}


/* الزهور والقلوب */

.flower,
.heart,
.sparkle {
    position: absolute;
    opacity: 0.45;
    animation: floatUp linear infinite;
}

.flower {
    font-size: 25px;
}

.heart {
    font-size: 20px;
}

.sparkle {
    font-size: 17px;
}


@keyframes floatUp {

    0% {
        transform:
            translateY(110vh)
            rotate(0deg);

        opacity: 0;
    }

    15% {
        opacity: 0.45;
    }

    100% {
        transform:
            translateY(-15vh)
            rotate(360deg);

        opacity: 0;
    }
}


/* الصندوق */

.container {

    position: relative;
    z-index: 5;

    width: 90%;
    max-width: 500px;
    min-height: 420px;

    background: rgba(255,255,255,0.88);

    backdrop-filter: blur(10px);

    border: 1px solid #f7dce7;

    border-radius: 30px;

    box-shadow:
        0 15px 45px rgba(190, 100, 135, 0.12);

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 30px;
}


/* الصفحات */

.page {
    width: 100%;
    animation: appear 0.7s ease;
}

.hidden {
    display: none;
}


@keyframes appear {

    from {
        opacity: 0;
        transform: scale(0.88);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* العنوان */

.title {

    font-size: 34px;

    margin-bottom: 18px;

    color: #a3476c;
}


.subtitle {

    font-size: 19px;

    margin-bottom: 35px;

    color: #9a687a;
}


/* الأزرار */

.buttons {

    display: flex;

    justify-content: center;

    gap: 18px;
}


button {

    border: none;

    padding: 14px 32px;

    border-radius: 50px;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;

    font-family: inherit;
}


.yes {

    background: #f58bad;

    color: white;

    box-shadow:
        0 7px 18px rgba(245, 139, 173, 0.25);
}


.yes:hover {

    transform: scale(1.07);
}


.no {

    background: white;

    color: #a95a76;

    border: 1px solid #f0cbd8;

    position: relative;
}


/* صفحة كفو */

.success-title {

    font-size: 31px;

    color: #cf5b7f;

    margin-bottom: 18px;
}


.success-text {

    font-size: 20px;

    line-height: 1.9;

    color: #85566a;
}


/* زر اضغطي هنا */

.press {

    margin-top: 25px;

    background: #f58bad;

    color: white;

    box-shadow:
        0 8px 20px rgba(245, 139, 173, 0.25);

    animation: pulse 1.5s infinite;
}


@keyframes pulse {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.07);
    }
}


/* البسة */

.cat-area {

    position: relative;

    margin-top: 5px;
}


.cat {

    font-size: 110px;

    animation: catBounce 2s ease-in-out infinite;
}


@keyframes catBounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


/* الكيكة */

.cake {

    position: relative;

    margin: -5px auto 18px;

    width: 180px;
    height: 75px;

    background: #f7a4c0;

    border-radius:
        15px
        15px
        25px
        25px;

    box-shadow:
        inset 0 -10px rgba(200, 80, 125, 0.12);

    border: 3px solid white;
}


.cake::before {

    content: "";

    position: absolute;

    width: 190px;
    height: 28px;

    background: white;

    border-radius: 50%;

    left: -8px;
    top: -12px;
}


.cake-text {

    position: absolute;

    z-index: 3;

    width: 100%;

    top: 20px;

    left: 0;

    font-size: 13px;

    font-weight: bold;

    color: #a3335c;
}


.candle {

    position: absolute;

    width: 10px;
    height: 28px;

    background: #f7d675;

    top: -35px;

    left: 85px;

    border-radius: 5px;
}


.flame {

    position: absolute;

    top: -18px;

    left: -3px;

    font-size: 16px;
}


/* النهاية */

.final-title {

    color: #c94f78;

    font-size: 28px;

    line-height: 1.5;

    margin-top: 10px;
}


.final-sub {

    font-size: 18px;

    margin-top: 10px;

    color: #916577;
}


/* الكونفيتي */

.confetti {

    position: fixed;

    top: -20px;

    font-size: 20px;

    animation:
        confettiFall 4s linear forwards;

    z-index: 20;
}


@keyframes confettiFall {

    to {

        transform:
            translateY(110vh)
            rotate(720deg);
    }
}


/* الجوال */

@media (max-width: 500px) {

    .container {

        min-height: 400px;

        padding: 22px;

        width: 92%;
    }


    .title {
        font-size: 30px;
    }


    .subtitle {
        font-size: 18px;
    }


    .cat {
        font-size: 95px;
    }


    .final-title {
        font-size: 24px;
    }

}

</style>
</head>


<body>


<!-- الخلفية -->

<div class="background" id="background"></div>


<div class="container">


    <!-- السؤال -->

    <div class="page" id="questionPage">

        <div class="title">
            أنتِ رغد؟
        </div>

        <div class="subtitle">
            عندي سؤال مهم جدًا...
        </div>


        <div class="buttons">

            <button
                class="yes"
                onclick="sayYes()">

                إي

            </button>


            <button
                class="no"
                id="noButton">

                لا

            </button>

        </div>

    </div>



    <!-- صفحة النجاح -->

    <div
        class="page hidden"
        id="successPage">


        <div style="font-size:65px;">
            🎀
        </div>


        <div class="success-title">

            كفو على تقديمك للمشروع!

        </div>


        <div class="success-text">

            كنت متأكد إنك بتختارين الإجابة الصح

            <br>

            عندي لك شيء صغير...

        </div>


        <button
            class="press hidden"
            id="pressButton"
            onclick="showBirthday()">

            اضغطي هنا

        </button>

    </div>



    <!-- صفحة عيد الميلاد -->

    <div
        class="page hidden"
        id="birthdayPage">


        <div class="cat-area">


            <div class="cat">
                🐱
            </div>


            <div class="cake">


                <div class="candle">

                    <div class="flame">
                        🔥
                    </div>

                </div>


                <div class="cake-text">
                    كل عام وأنتِ بخير
                </div>


            </div>

        </div>


        <div class="final-title">

            كل عام وأنتِ بخيررر

        </div>


        <div class="final-sub">

            أتمنى تكون سنتك الجاية مليانة أشياء حلوة

            <br>

            🌸 💗 ✨

        </div>


    </div>

</div>



<script>


/* خلفية متحركة */

const background =
    document.getElementById("background");


const decorations = [

    "🌸",
    "🌷",
    "🌹",
    "💗",
    "💕",
    "✨",
    "🌺",
    "💖"

];


for (let i = 0; i < 35; i++) {


    const item =
        document.createElement("div");


    item.className =

        i % 3 === 0
        ? "flower"
        : i % 3 === 1
        ? "heart"
        : "sparkle";


    item.innerText =
        decorations[
            Math.floor(
                Math.random()
                * decorations.length
            )
        ];


    item.style.left =
        Math.random() * 100 + "%";


    item.style.animationDuration =
        (5 + Math.random() * 8) + "s";


    item.style.animationDelay =
        (Math.random() * 8) + "s";


    item.style.fontSize =
        (15 + Math.random() * 20) + "px";


    background.appendChild(item);

}



/* زر لا يهرب */

const noButton =
    document.getElementById("noButton");


function moveNoButton() {


    const maxX =
        window.innerWidth
        - noButton.offsetWidth
        - 20;


    const maxY =
        window.innerHeight
        - noButton.offsetHeight
        - 20;


    const x =
        Math.max(
            10,
            Math.random() * maxX
        );


    const y =
        Math.max(
            10,
            Math.random() * maxY
        );


    noButton.style.position =
        "fixed";


    noButton.style.left =
        x + "px";


    noButton.style.top =
        y + "px";

}


noButton.addEventListener(
    "mouseenter",
    moveNoButton
);


noButton.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        moveNoButton();

    }
);



/* الضغط على إي */

function sayYes() {


    document
        .getElementById("questionPage")
        .classList.add("hidden");


    document
        .getElementById("successPage")
        .classList.remove("hidden");


    setTimeout(
        function() {

            document
                .getElementById("pressButton")
                .classList.remove("hidden");

        },
        3000
    );

}



/* صفحة عيد الميلاد */

function showBirthday() {


    document
        .getElementById("successPage")
        .classList.add("hidden");


    document
        .getElementById("birthdayPage")
        .classList.remove("hidden");


    createConfetti();

}



/* كونفيتي */

function createConfetti() {


    const pieces = [

        "💗",
        "💕",
        "🌸",
        "✨",
        "🎀",
        "🌷",
        "💖"

    ];


    for (let i = 0; i < 45; i++) {


        const confetti =
            document.createElement("div");


        confetti.className =
            "confetti";


        confetti.innerText =
            pieces[
                Math.floor(
                    Math.random()
                    * pieces.length
                )
            ];


        confetti.style.left =
            Math.random() * 100 + "vw";


        confetti.style.animationDuration =
            (2.5 + Math.random() * 3)
            + "s";


        confetti.style.animationDelay =
            Math.random() * 2 + "s";


        document.body.appendChild(
            confetti
        );


        setTimeout(
            () => confetti.remove(),
            6000
        );

    }

}

</script>

</body>
</html>
